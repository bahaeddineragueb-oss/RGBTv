plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
}

android {
    namespace 'com.rgbtv.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rgbtv.app'
        minSdk 24
        targetSdk 35
        versionCode 501
        versionName '5.0.1'
        vectorDrawables { useSupportLibrary true }
    }

    // Release signing: uses the CI keystore when RGBTV_KEYSTORE_PATH is set,
    // otherwise falls back to the auto-generated debug key (sideload-ready APK).
    def releaseKs = System.getenv('RGBTV_KEYSTORE_PATH')
    if (releaseKs != null && !releaseKs.isEmpty()) {
        signingConfigs {
            release {
                storeFile file(releaseKs)
                storePassword System.getenv('RGBTV_KEYSTORE_PASS')
                keyAlias(System.getenv('RGBTV_KEY_ALIAS') ?: 'rgbtv')
                keyPassword System.getenv('RGBTV_KEY_PASS') ?: System.getenv('RGBTV_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    buildFeatures {
        viewBinding true
        compose true
    }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Compose (versions from BOM)
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // Images
    implementation 'io.coil-kt:coil-compose:2.5.0'
    // Room (local library DB)
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'
    def media3 = '1.11.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
}
