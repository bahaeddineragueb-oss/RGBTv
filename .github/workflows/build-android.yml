# Builds the RGBTv NATIVE Android app (.apk, ExoPlayer, no WebView) on a free GitHub runner.
# Run: Actions → "Build Android APK (native)" → Run workflow → download the APK from Artifacts
# (or from the "native-v5.0.0" release when publish_release is on).
name: Build Android APK (native)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the APK to release "native-v5.0.0"'
        type: boolean
        default: true
  push:
    branches: [main, master, 'arena/**']
    paths:
      - 'native/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Decode release keystore (optional)
        env:
          RGBTV_KEYSTORE_BASE64: ${{ secrets.RGBTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RGBTV_KEYSTORE_BASE64" ]; then echo "No release keystore secret — using debug signing."; exit 0; fi
          echo "$RGBTV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RGBTV_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "RGBTV_KEYSTORE_PASS=${{ secrets.RGBTV_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          echo "RGBTV_KEY_ALIAS=${{ secrets.RGBTV_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RGBTV_KEY_PASS=${{ secrets.RGBTV_KEY_PASS }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0



      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk RGBTv-native-5.0.0.apk
          ls -lh RGBTv-native-5.0.0.apk

      - name: Verify APK
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          echo "aapt: $AAPT"
          "$AAPT" dump badging RGBTv-native-5.0.0.apk | grep -E "package:|sdkVersion|targetSdkVersion|application-label:"
          "$AAPT" dump badging RGBTv-native-5.0.0.apk | grep -q "package: name='com.rgbtv.app'"
          "$(dirname "$AAPT")/apksigner" verify RGBTv-native-5.0.0.apk && echo "signature OK"
          test $(stat -c%s RGBTv-native-5.0.0.apk) -gt 1000000 && echo "size OK"

      - name: Report errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -a -E "e: |error:|Caused by:|Execution failed for task" build.log | head -25 | sed 's/%/%25/g' | cut -c1-400 | sed 's/^/::error::/'
            grep -a -A6 "What went wrong" build.log | head -14 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-500 | sed 's/^/::error::/'
          else
            echo "::error::no build.log produced"
          fi
          echo done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: native/build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGBTv-native-apk
          path: native/RGBTv-native-5.0.0.apk
          if-no-files-found: error




      - name: Commit APK to repo
        run: |
          cd ..
          mkdir -p dist
          cp native/RGBTv-native-5.0.0.apk dist/RGBTv-v5.0.0.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f dist/RGBTv-v5.0.0.apk
          git commit -m "dist: RGBTv v5.0.0 APK" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v5.0.0
          name: 'RGBTv 5.0.0 — Android native APK'
          body: |
            ## RGBTv 5.0.0 — تطبيق أندرويد أصلي (Native)

            - مشغّل ExoPlayer أصلي — بدون WebView، أداء عالٍ وتشغيل سريع
            - Xtream Codes + Stalker + M3U + دليل XMLTV
            - بث مباشر / أفلام / مسلسلات + استئناف + حلقات تلقائية
            - يعمل على الهاتف والتابلت و Android TV (ريموت)

            **التثبيت:** حمّل `RGBTv-native-5.0.0.apk` وثبّته على جهازك (فعّل «مصادر غير معروفة»).
            **ملاحظة:** إن كانت نسخة WebView القديمة مثبّتة (بنفس الاسم)، احذفها أولاً ثم ثبّت هذه.

            ## RGBTv 5.0.0 — native Android app

            - Native ExoPlayer (no WebView): fast start, smooth playback
            - Xtream Codes + Stalker + M3U + XMLTV guide
            - Live / Movies / Series + resume + auto-next episode
            - Phone, tablet & Android TV (D-pad remote)

            **Install:** download `RGBTv-native-5.0.0.apk` and sideload it (allow “unknown sources”).
            **Note:** if the old WebView build is installed, uninstall it first (different signature).
          files: native/RGBTv-native-5.0.0.apk
